name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.0

jobs:
  build-linux-android:
    name: Linux and Android
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install project dependencies
        run: flutter pub get --enforce-lockfile
      - name: Fix libdartjni build ID
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "${PUB_CACHE}"/hosted/*/jni-*/src/CMakeLists.txt
      - name: Verify Flutter version
        run: flutter --version
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev
      - name: Enable Linux build
        run: flutter config --enable-linux-desktop
      - name: Build Linux artifacts
        run: flutter build linux --release
      - name: Build AppImage
        run: bash ./github_appimage_build.sh
      - name: Package Linux bundle
        run: tar -C build/linux/x64/release/bundle -cf flut-renamer-linux.tar.gz ./
      - name: Upload Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-linux
          path: flut-renamer-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-appimage
          path: Flut_Renamer-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Decode Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 secret.' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flut-renamer.jks"
          echo "KEYSTORE=$RUNNER_TEMP/flut-renamer.jks" >> "$GITHUB_ENV"
      - name: Build signed Android APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Missing Android signing secrets.' >&2
            exit 1
          }
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Upload Android APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove Android signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/flut-renamer.jks"

  build-windows:
    name: Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install project dependencies
        run: flutter pub get --enforce-lockfile
      - name: Enable Windows build
        run: flutter config --enable-windows-desktop
      - name: Build Windows artifacts
        run: flutter build windows --release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install Enigma Virtual Box
        run: npm install --global enigmavirtualbox@0.9.10
      - name: Create Enigma Virtual Box configuration
        run: dart run dev/windows_evb_config_generator.dart
      - name: Build single-file executable
        run: enigmavirtualbox cli 'flut-renamer.evb'
      - name: Upload Windows executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-win
          path: flut-renamer.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS and iOS verification
    runs-on: macos-14

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: arm64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install project dependencies
        run: flutter pub get --enforce-lockfile
      - name: Enable macOS build
        run: flutter config --enable-macos-desktop
      - name: Build macOS artifacts
        run: flutter build macos --release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install DMG packaging tool
        run: npm install --global appdmg@0.6.6
      - name: Build unsigned DMG
        run: appdmg ./dmg/config.json ./build/macos/Build/Products/Release/flut-renamer.dmg
      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-macos
          path: build/macos/Build/Products/Release/flut-renamer.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Build unsigned iOS IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload flut-renamer-ios-unsigned.ipa
      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flut-renamer-ios-unsigned
          path: flut-renamer-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  upload-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build-linux-android
      - build-windows
      - build-macos
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: flut-renamer-release
          merge-multiple: true
      - name: Publish release assets
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
          artifacts: flut-renamer-release/*
