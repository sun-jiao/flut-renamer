name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install project dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Test CI simulator selection
        run: node --test tool/boot_ios_simulator_test.cjs

  integration-linux:
    name: Linux integration test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Install Linux integration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libblkid-dev liblzma-dev xvfb xauth
      - name: Install project dependencies
        run: flutter pub get --enforce-lockfile
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Run Linux integration tests
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24' bash tool/integration_linux.sh --no-pub 2>&1 | tee integration-linux.log
      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-linux-log
          path: integration-linux.log
          if-no-files-found: ignore
          retention-days: 7

  integration-desktop:
    name: Integration / ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            device: windows
            architecture: x64
          - os: macos-15
            device: macos
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: ${{ matrix.architecture }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - run: flutter config --enable-${{ matrix.device }}-desktop
      - name: Run desktop integration tests
        shell: bash
        run: bash tool/integration_ci.sh ${{ matrix.device }} integration_test/desktop_test.dart
      - name: Upload platform diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-${{ matrix.device }}
          path: integration-*.log
          if-no-files-found: ignore
          retention-days: 7

  integration-android:
    name: Integration / Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # API 29 exercises bionic's pre-renameat2-export syscall fallback.
        api: [29, 35]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: x64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Install compile SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ -z "$sdk_root" || ! -x "$sdk_manager" ]]; then
            echo 'Android command-line tools are missing from the hosted runner.' >&2
            exit 1
          fi
          "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-37'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on a fresh Android emulator
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tool/integration_ci.sh emulator-5554 integration_test/platform_test.dart
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-android-${{ matrix.api }}
          path: |
            integration-*.log
            build/app/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  integration-ios:
    name: Integration / iOS simulator
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          architecture: arm64
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - name: Create and boot a disposable iPhone simulator
        run: node tool/boot_ios_simulator.cjs
      - name: Run iOS integration tests (no signing secrets needed)
        run: bash tool/integration_ci.sh "$RENAMER_SIMULATOR_ID" integration_test/platform_test.dart
      - name: Capture simulator diagnostics
        if: failure() && env.RENAMER_SIMULATOR_ID != ''
        run: xcrun simctl spawn "$RENAMER_SIMULATOR_ID" log show --last 10m --style compact > integration-device.log 2>&1 || true
      - name: Remove the job-owned simulator
        if: always() && env.RENAMER_SIMULATOR_ID != ''
        run: |
          xcrun simctl shutdown "$RENAMER_SIMULATOR_ID" || true
          xcrun simctl delete "$RENAMER_SIMULATOR_ID"
      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-ios
          path: integration-*.log
          if-no-files-found: ignore
          retention-days: 7
